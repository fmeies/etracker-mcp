name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets the Docker workflow gate publishing on the tests
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
