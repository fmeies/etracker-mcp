{{- /* The rate limiter is in-memory: each extra pod would get its own copy of etracker's per-account quota */ -}}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: rate limits are kept in memory per pod, so more replicas would exceed etracker's 50 calls / 5 min quota" }}
{{- end }}
{{- $_ := required "partnerApiKeys is required (JSON object of key → partner ID); pass it via -f my-values.yaml" .Values.partnerApiKeys }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "etracker-mcp.name" . }}
  labels:
    {{- include "etracker-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "etracker-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "etracker-mcp.selectorLabels" . | nindent 8 }}
    spec:
      # Lets in-flight requests finish on rollout; the app exits on SIGTERM within 20 s
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etracker-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: PARTNER_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "etracker-mcp.name" . }}
                  key: PARTNER_API_KEYS
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.etrackerReports.pageviews }}
            - name: ETRACKER_REPORT_PAGEVIEWS
              value: {{ .Values.etrackerReports.pageviews | quote }}
            {{- end }}
            {{- if .Values.etrackerReports.conversions }}
            - name: ETRACKER_REPORT_CONVERSIONS
              value: {{ .Values.etrackerReports.conversions | quote }}
            {{- end }}
            {{- if .Values.etrackerReports.ad }}
            - name: ETRACKER_REPORT_AD
              value: {{ .Values.etrackerReports.ad | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
