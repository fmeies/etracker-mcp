# Must stay 1: rate limits are in-memory per pod (the chart refuses to render otherwise)
replicaCount: 1

image:
  repository: etracker-mcp
  tag: latest
  # "latest" is a moving tag, so always pull; pin a version tag to use IfNotPresent
  pullPolicy: Always

service:
  # ClusterIP keeps the plain-HTTP service inside the cluster; expose it via the
  # TLS ingress. NodePort opens it on every node's IP, so use it only for local
  # testing (e.g. Docker Desktop: localhost:<nodePort>).
  type: ClusterIP
  port: 80
  targetPort: 3000
  nodePort: 30300  # used only when type is NodePort

ingress:
  enabled: false
  className: nginx
  host: etracker-mcp.example.com
  tls: false
  # tlsSecretName: etracker-mcp-tls

# Partner API keys → partner IDs (JSON object).
# The etracker token is NOT stored here — partners pass it inside the
# Authorization header: "Authorization: Bearer <partnerKey>.<etrackerToken>"
# Example: '{"key-abc":"partner-a","key-xyz":"partner-b"}'
partnerApiKeys: ""

# debug | info | warn | error — any other value stops the server at startup
logLevel: info

# Optional etracker report ID overrides
etrackerReports:
  pageviews: ""    # default: EATime
  conversions: ""  # default: EAConversions
  ad: ""           # default: EAMedium (marketing channels)

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Number of old ReplicaSets to retain
revisionHistoryLimit: 3
